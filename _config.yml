# Jekyll configuration

name: Ryan Spletzer
title: Ryan Spletzer
author: Ryan Spletzer
email: ryanspletzer@gmail.com
description: Ryan Spletzer's blog on software engineering and technology.

# Absolute site origin — used for canonical links, og:/twitter meta tags,
# JSON-LD, both feeds, and the sitemap
url: https://www.spletzer.com
#url: https://ryanspletzer.github.io
#url: http://localhost:4000

# For a project page here should be a project name. Otherwise (for user's/organization's page leave it empty)
baseurl: ''

links:
  - text: GitHub
    url: https://github.com/ryanspletzer
  - text: Bluesky
    url: https://bsky.app/profile/ryan.spletzer.com
  - text: LinkedIn
    url: https://www.linkedin.com/in/ryanspletzer/
  - text: Mastodon
    url: https://spletzer.com/@ryan

# Google Analytics key, leave blank to ignore
google_analytics_key: G-92E8FVFHFW

permalink: /:year/:month/:title/

# Frontmatter dates carry no zone, so render them in UTC everywhere — CI
# already builds in UTC; without this a local build in another zone
# shifts `date: 2026-07-11 00:00:00` to the evening of July 10
timezone: UTC

plugins:
  - jekyll-redirect-from

# Enable for using pages, more details are here: http://jekyllrb.com/docs/pagination/
#paginate: 3

#highlighter: rouge

markdown: kramdown
kramdown:
  input: GFM # Enable GitHub Flavored Markdown (fenced code blocks)
  hard_wrap: false

exclude:
  - README.md
  - LICENSE
  - AGENTS.md
  - CLAUDE.md
  - plans
  - e2e
  - scripts
  - package.json
  - tsconfig.json
  - playwright.config.ts
  - bun.lock
  - playwright-report
  - test-results

sass:
    sass_dir: _sass
    style: compressed
